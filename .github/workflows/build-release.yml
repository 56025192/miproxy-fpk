name: Build FPK

on:
  # push 到 main 分支时触发（所有文件变更）
  push:
    branches: [main]
  
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.1.7，不填则自动从 manifest 读取)'
        required: false
        default: ''

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ==================== 分析变更 ====================
  analyze:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_message: ${{ steps.commit.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^version" manifest | sed 's/.*= *//')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 版本: ${VERSION}"

      - name: Get commit message
        id: commit
        run: |
          MSG=$(git log -1 --format="%s")
          echo "message=${MSG}" >> $GITHUB_OUTPUT
          echo "📝 最新提交: ${MSG}"

  # ==================== 构建 FPK ====================
  build:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install fnpack
        run: |
          echo "📦 安装 fnpack..."
          curl -sL "https://github.com/fnndsc/fnos-cli/releases/latest/download/fnos-cli-linux-amd64" -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --version

      - name: Build FPK
        id: build
        run: |
          echo "🔨 打包 FPK..."
          fnpack build . 2>&1
          
          # 查找生成的 fpk 文件
          FPK=$(ls -t *.fpk 2>/dev/null | head -1)
          if [ -n "$FPK" ]; then
            echo "✅ FPK 打包成功: $FPK"
            echo "fpk_file=$FPK" >> $GITHUB_OUTPUT
          else
            echo "❌ FPK 打包失败"
            exit 1
          fi

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miproxy-fpk-${{ needs.analyze.outputs.version }}
          path: ${{ runner.temp }}/*.fpk
          retention-days: 7

  # ==================== 创建草稿 Release ====================
  draft:
    needs: [analyze, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download FPK
        uses: actions/download-artifact@v4
        with:
          name: miproxy-fpk-${{ needs.analyze.outputs.version }}

      - name: Get changed files
        id: changed
        run: |
          # 获取所有变更文件
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "=== 变更文件 ==="
          if [ -n "$LAST_TAG" ]; then
            git diff ${LAST_TAG}..HEAD --name-only | head -30
            echo ""
            echo "=== 提交历史 ==="
            git log ${LAST_TAG}..HEAD --oneline --format="• %s | %an | %cr"
          else
            git log -10 --oneline --format="• %s | %an | %cr"
          fi > /tmp/changes.txt
          
          CHANGES=$(cat /tmp/changes.txt)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.analyze.outputs.version }}
          name: MiProxy v${{ needs.analyze.outputs.version }} - 草稿
          draft: true
          prerelease: false
          body: |
            ## ⚠️ 草稿版本待发布

            此版本包含最新提交，请审核后决定是否发布。

            ---

            ### 📝 最新提交

            **${{ needs.analyze.outputs.commit_message }}**

            ---

            ### 📋 变更详情

            ```
            ${{ needs.analyze.outputs.changes }}
            ```

            ---

            ### 📦 下载测试

            - **FPK**: miproxy-v${{ needs.analyze.outputs.version }}.fpk

            ---

            ### 🔄 操作

            请点击右上角 **Publish release** 按钮发布，或编辑后发布。

            ---
            *由 GitHub Actions 自动创建*
          files: |
            *.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment to commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 0,
              body: `## 🔔 新草稿 Release 已创建

              **版本**: v${{ needs.analyze.outputs.version }}
              
              **最新提交**: ${{ needs.analyze.outputs.commit_message }}
              
              **Release**: ${{ steps.create_release.outputs.url }}

              请审核变更内容，确认无误后点击 **Publish release** 发布。
              
              ---
              *由 GitHub Actions 自动通知*`
            })
        continue-on-error: true

      - name: Summary
        run: |
          echo "## ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: v${{ needs.analyze.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**草稿 Release**: ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请审核后手动点击 **Publish release** 发布。" >> $GITHUB_STEP_SUMMARY
