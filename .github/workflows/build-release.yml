name: Build FPK

on:
  # 通过 tag 触发构建（如 v2.1.7）
  push:
    tags: ['v*']
  
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.1.7)'
        required: false
        default: ''
      create_release:
        description: '创建 Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ==================== 构建 FPK ====================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # ========== 检出代码 ==========
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 确定版本号 ==========
      - name: 确定版本号
        id: version
        run: |
          MANIFEST_VER=$(grep '^version' manifest | awk -F'=' '{print $2}' | tr -d ' ')
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${MANIFEST_VER}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 版本: ${VERSION}"

      # ========== 修复脚本权限 ==========
      - name: 修复脚本权限
        run: |
          for f in cmd/main cmd/install_init cmd/install_callback cmd/uninstall_init cmd/uninstall_callback cmd/upgrade_init cmd/upgrade_callback cmd/config_init cmd/config_callback; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done
          echo "✅ 脚本权限已修复"

      # ========== 下载 fnpack 并打包 ==========
      - name: 下载 fnpack 并打包
        id: build
        run: |
          echo "📦 下载 fnpack..."
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 || { echo "下载失败"; exit 1; }
          chmod +x /tmp/fnpack
          echo "✅ fnpack 下载完成"
          
          echo "📁 检查当前目录..."
          ls -la
          
          echo "🔨 开始打包..."
          /tmp/fnpack build --directory . 2>&1
          BUILD_EXIT=$?
          
          echo "打包退出码: $BUILD_EXIT"
          
          # 重命名为带版本号的文件名
          VERSION="${{ steps.version.outputs.version }}"
          FPK=$(ls *.fpk 2>/dev/null | head -1)
          if [ -n "$FPK" ]; then
            NEW_FPK="miproxy-${VERSION}.fpk"
            mv "$FPK" "$NEW_FPK"
            echo "✅ FPK 打包成功: $NEW_FPK"
            echo "fpk_file=$NEW_FPK" >> $GITHUB_OUTPUT
          else
            echo "❌ FPK 打包失败"
            ls -la
            exit 1
          fi

      # ========== 上传产物 ==========
      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          name: miproxy-fpk
          path: "*.fpk"
          retention-days: 7

  # ==================== 创建草稿 Release ====================
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 FPK
        uses: actions/download-artifact@v4
        with:
          name: miproxy-fpk

      - name: 获取变更信息
        id: changes
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "上一个版本: ${LAST_TAG:-无}"
          
          if [ -n "$LAST_TAG" ]; then
            echo "=== 变更文件 ===" > /tmp/changes.txt
            git diff ${LAST_TAG}..HEAD --name-only | head -20 >> /tmp/changes.txt
            echo "" >> /tmp/changes.txt
            echo "=== 提交历史 ===" >> /tmp/changes.txt
            git log ${LAST_TAG}..HEAD --oneline --format="• %s | %an | %cr" >> /tmp/changes.txt
          else
            echo "=== 首次发布 ===" > /tmp/changes.txt
            git log -10 --oneline --format="• %s | %an | %cr" >> /tmp/changes.txt
          fi
          
          CHANGES=$(cat /tmp/changes.txt)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建草稿 Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "MiProxy ${{ needs.build.outputs.version }}"
          draft: true
          prerelease: false
          body: |
            ## MiProxy ${{ needs.build.outputs.version }}

            飞牛 NAS (fnOS) FPK 应用

            ---

            ### 📋 变更详情

            ```
            ${{ needs.draft.outputs.changes }}
            ```

            ---

            ### 📥 下载

            - **FPK**: miproxy-${{ needs.build.outputs.version }}.fpk

            ---

            ### 🔄 操作

            请审核变更内容，确认无误后点击 **Publish release** 发布。

            ---
            *由 GitHub Actions 自动创建*
          files: |
            "*.fpk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**草稿 Release**: ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请审核后手动点击 **Publish release** 发布。" >> $GITHUB_STEP_SUMMARY
