name: Sync Binaries

on:
  # 每天凌晨 2:00 自动执行
  schedule:
    - cron: '0 2 * * *'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      skip_mihomo:
        description: '跳过 mihomo'
        required: false
        default: 'false'
      skip_geo:
        description: '跳过 GEO 数据库'
        required: false
        default: 'false'
      skip_ui:
        description: '跳过控制面板'
        required: false
        default: 'false'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== mihomo x86_64 ====================
      - name: Download mihomo (x86_64)
        if: inputs.skip_mihomo != 'true'
        id: mihomo-x86
        run: |
          echo "📥 下载 mihomo x86_64..."
          
          MIHOMO_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name"' | sed 's/.*"v\?\([^"]*\)".*/\1/')
          echo "mihomo_version=${MIHOMO_VERSION}" >> $GITHUB_ENV
          echo "📦 mihomo 版本: ${MIHOMO_VERSION}"
          
          # 下载并解压
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz" | gunzip > mihomo-x86
          
          if file mihomo-x86 | grep -q "ELF"; then
            chmod +x mihomo-x86
            mkdir -p app/server/x86_64
            mv mihomo-x86 app/server/x86_64/mihomo
            echo "✅ mihomo x86_64 下载成功"
          else
            echo "❌ mihomo x86_64 下载失败"
            exit 1
          fi

      # ==================== mihomo ARM64 ====================
      - name: Download mihomo (ARM64)
        if: inputs.skip_mihomo != 'true'
        id: mihomo-arm
        run: |
          echo "📥 下载 mihomo ARM64..."
          
          MIHOMO_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name"' | sed 's/.*"v\?\([^"]*\)".*/\1/')
          
          # 下载并解压
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-arm64-v${MIHOMO_VERSION}.gz" | gunzip > mihomo-arm64
          
          if file mihomo-arm64 | grep -q "ELF"; then
            chmod +x mihomo-arm64
            mkdir -p app/server/arm64
            mv mihomo-arm64 app/server/arm64/mihomo
            echo "✅ mihomo ARM64 下载成功"
          else
            echo "❌ mihomo ARM64 下载失败"
            exit 1
          fi

      # ==================== GEO 数据库 ====================
      - name: Download GEO databases
        if: inputs.skip_geo != 'true'
        id: geo
        run: |
          echo "📥 下载 GEO 数据库..."
          
          mkdir -p app/data
          
          # geoip.dat
          echo "  - geoip.dat"
          curl -sL "https://github.com/MetaCubeX/mihomo-ruleset/releases/latest/download/geoip.dat" -o app/data/geoip.dat
          
          # geosite.dat
          echo "  - geosite.dat"  
          curl -sL "https://github.com/MetaCubeX/mihomo-ruleset/releases/latest/download/geosite.dat" -o app/data/geosite.dat
          
          # Country.mmdb
          echo "  - Country.mmdb"
          curl -sL "https://github.com/MetaCubeX/mihomo-ruleset/releases/latest/download/Country.mmdb" -o app/data/Country.mmdb
          
          # 验证
          for f in geoip.dat geosite.dat Country.mmdb; do
            if [ -s "app/data/$f" ]; then
              SIZE=$(du -h "app/data/$f" | cut -f1)
              echo "  ✅ $f ($SIZE)"
            else
              echo "  ❌ $f 下载失败"
              exit 1
            fi
          done

      # ==================== Zashboard 面板 ====================
      - name: Download Zashboard
        if: inputs.skip_ui != 'true'
        id: zashboard
        run: |
          echo "📥 下载 Zashboard 面板..."
          
          ZASHBOARD_VERSION=$(curl -s https://api.github.com/repos/Zephyruso/zashboard/releases/latest | grep '"tag_name"' | sed 's/.*"v\?\([^"]*\)".*/\1/')
          echo "zashboard_version=${ZASHBOARD_VERSION}" >> $GITHUB_ENV
          echo "📦 Zashboard 版本: ${ZASHBOARD_VERSION}"
          
          # 下载完整版（包含所有字体）
          curl -sL "https://github.com/Zephyruso/zashboard/releases/download/v${ZASHBOARD_VERSION}/dist.zip" -o zashboard.zip
          
          if [ -s zashboard.zip ]; then
            rm -rf app/ui/zashboard
            unzip -q zashboard.zip -d zashboard-tmp
            mv zashboard-tmp app/ui/zashboard
            rm -rf zashboard-tmp zashboard.zip
            echo "✅ Zashboard 下载成功"
          else
            echo "❌ Zashboard 下载失败"
            exit 1
          fi

      # ==================== MetaCubeXD 面板 ====================
      - name: Download MetaCubeXD
        if: inputs.skip_ui != 'true'
        id: metacubexd
        run: |
          echo "📥 下载 MetaCubeXD 面板..."
          
          METAXD_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest | grep '"tag_name"' | sed 's/.*"v\?\([^"]*\)".*/\1/')
          echo "metacubexd_version=${METAXD_VERSION}" >> $GITHUB_ENV
          echo "📦 MetaCubeXD 版本: ${METAXD_VERSION}"
          
          curl -sL "https://github.com/MetaCubeX/metacubexd/releases/download/v${METAXD_VERSION}/metacubexd-linux-amd64.zip" -o metacubexd.zip
          
          if [ -s metacubexd.zip ]; then
            rm -rf app/ui/metacubexd
            unzip -q metacubexd.zip -d metacubexd-tmp
            mv metacubexd-tmp app/ui/metacubexd
            rm -rf metacubexd-tmp metacubexd.zip
            echo "✅ MetaCubeXD 下载成功"
          else
            echo "❌ MetaCubeXD 下载失败"
            exit 1
          fi

      # ==================== 提交更改 ====================
      - name: Commit and push
        run: |
          echo "📝 检查更改..."
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ 没有需要更新的内容"
          else
            git diff --staged --stat
            
            COMMIT_MSG="🔄 自动同步二进制文件
            
            - mihomo: ${{ env.mihomo_version || '跳過' }}
            - Zashboard: ${{ env.zashboard_version || '跳過' }}
            - MetaCubeXD: ${{ env.metacubexd_version || '跳過' }}
            
            日期: $(date +'%Y-%m-%d')
            触发: ${{ github.event_name }}"
            
            git commit -m "${COMMIT_MSG}"
            echo "🚀 推送到 GitHub..."
            git push origin main
            echo "✅ 更新完成!"
          fi
