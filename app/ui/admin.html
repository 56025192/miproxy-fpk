<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProxy - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 { color: #1a1a2e; margin-bottom: 20px; font-size: 22px; }
        
        /* 配置区块 */
        .config-section {
            border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }
        .config-section h3 {
            color: #1a1a2e; margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 2px solid #10b981;
        }
        
        /* 表单样式 */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-weight: 500; color: #333;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #10b981;
        }
        
        /* 按钮 */
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: all 0.3s; margin-right: 10px;
        }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover { background: #059669; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 30px; }
        
        /* 成功消息 */
        .success-message {
            background: #dcfce7; color: #16a34a; padding: 20px; border-radius: 12px;
            text-align: center; margin: 20px 0;
        }
        .success-message h3 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>⚙️ 配置管理</h2>
                <button class="btn btn-secondary" onclick="goHome()">← 返回首页</button>
            </div>
            
            <div id="admin-content">
                <div class="config-section">
                    <h3>📡 订阅配置</h3>
                    <div class="form-group">
                        <label>订阅类型</label>
                        <select id="cfg-sub-type" onchange="toggleAdminSubFields()">
                            <option value="none">暂不配置</option>
                            <option value="remote">远程订阅 URL</option>
                            <option value="local">本地订阅文件</option>
                        </select>
                    </div>
                    <div id="cfg-sub-remote" class="form-group" style="display:none;">
                        <label>订阅 URL</label>
                        <input type="text" id="cfg-sub-url" placeholder="https://example.com/api/v1/client/subscribe?token=xxx" />
                    </div>
                    <div id="cfg-sub-local" class="form-group" style="display:none;">
                        <label>本地订阅文件路径</label>
                        <input type="text" id="cfg-sub-path" placeholder="/vol1/@appshare/miproxy/sub.yaml" />
                    </div>
                    <div class="form-group">
                        <label>自动刷新间隔</label>
                        <select id="cfg-refresh-interval">
                            <option value="0">关闭自动刷新</option>
                            <option value="1">每 1 小时</option>
                            <option value="6">每 6 小时</option>
                            <option value="12">每 12 小时</option>
                            <option value="24">每 24 小时</option>
                        </select>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>🔧 服务控制</h3>
                    <button class="btn btn-primary" id="btn-restart" onclick="restartService()">
                        🔄 重启服务
                    </button>
                    <span id="restart-status" style="margin-left:15px; color:#666;"></span>
                </div>
            </div>
            
            <div id="admin-result" style="display:none;"></div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goHome()">取消</button>
                <button class="btn btn-primary" id="btn-save" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>
    
    <script>
        // ========== 管理后台 ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadAdminConfig();
        });
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        function toggleAdminSubFields() {
            const type = document.getElementById('cfg-sub-type').value;
            document.getElementById('cfg-sub-remote').style.display = type === 'remote' ? 'block' : 'none';
            document.getElementById('cfg-sub-local').style.display = type === 'local' ? 'block' : 'none';
        }
        
        async function loadAdminConfig() {
            try {
                const res = await fetch('cgi-bin/config.cgi?action=get');
                const data = await res.json();
                if (data.config) {
                    document.getElementById('cfg-sub-type').value = data.config.sub_type || 'none';
                    document.getElementById('cfg-sub-url').value = data.config.sub_url || '';
                    document.getElementById('cfg-sub-path').value = data.config.sub_path || '';
                    document.getElementById('cfg-refresh-interval').value = data.config.refresh_interval || '0';
                    toggleAdminSubFields();
                }
            } catch (e) {
                console.error('加载配置失败:', e);
            }
        }
        
        async function saveConfig() {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = '保存中...';
            
            const config = {
                sub_type: document.getElementById('cfg-sub-type').value,
                sub_url: document.getElementById('cfg-sub-url').value,
                sub_path: document.getElementById('cfg-sub-path').value,
                refresh_interval: document.getElementById('cfg-refresh-interval').value
            };
            
            try {
                const res = await fetch('cgi-bin/config.cgi?action=save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('admin-result').innerHTML = `
                        <div class="success-message">
                            <h3>✅ 配置已保存</h3>
                            <p>配置文件已更新。点击"重启服务"使配置生效。</p>
                        </div>
                    `;
                    document.getElementById('admin-result').style.display = 'block';
                } else {
                    alert('保存失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
            
            btn.disabled = false;
            btn.textContent = '保存配置';
        }
        
        async function restartService() {
            const btn = document.getElementById('btn-restart');
            const status = document.getElementById('restart-status');
            
            btn.disabled = true;
            btn.textContent = '重启中...';
            status.textContent = '正在重启服务...';
            
            try {
                const res = await fetch('cgi-bin/config.cgi?action=restart', {
                    method: 'POST'
                });
                const data = await res.json();
                
                if (data.success) {
                    status.textContent = '✓ 服务已重启';
                    status.style.color = '#16a34a';
                } else {
                    status.textContent = '✗ 重启失败: ' + (data.error || '');
                    status.style.color = '#dc2626';
                }
            } catch (e) {
                status.textContent = '✗ 重启失败: ' + e.message;
                status.style.color = '#dc2626';
            }
            
            btn.disabled = false;
            btn.textContent = '🔄 重启服务';
        }
    </script>
</body>
</html>
