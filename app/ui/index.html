<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProxy - 选择面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .panels {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .panel-card {
            flex: 1;
            min-width: 180px;
            padding: 30px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }
        .panel-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .panel-card img {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }
        .panel-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .panel-card p {
            font-size: 12px;
            color: #888;
        }
        .zashboard {
            border-color: #10b981;
        }
        .zashboard:hover {
            border-color: #10b981;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        .metacubexd {
            border-color: #f59e0b;
        }
        .metacubexd:hover {
            border-color: #f59e0b;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-top: 8px;
        }
        .badge-recommend {
            background: #10b981;
            color: white;
        }
        .badge-lightweight {
            background: #f59e0b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MiProxy</h1>
        <p class="subtitle">请选择要打开的控制面板</p>
        
        <div class="panels">
            <a href="/ui/zashboard/" class="panel-card zashboard" target="_blank">
                <h2>📊 Zashboard</h2>
                <p>现代化界面，功能丰富</p>
                <span class="badge badge-recommend">推荐</span>
            </a>
            
            <a href="/ui/metacubexd/" class="panel-card metacubexd" target="_blank">
                <h2>📋 MetaCubeXD</h2>
                <p>经典 Clash 风格，轻量稳定</p>
                <span class="badge badge-lightweight">轻量</span>
            </a>
        </div>
        
        <p style="margin-top: 30px; font-size: 12px; color: #999;">
            提示：点击后将打开对应的控制面板
        </p>
    </div>
</body>
</html>
