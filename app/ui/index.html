<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiProxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        
        /* 加载状态 */
        .loading-box {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0f2fe;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #0369a1; font-size: 14px; }
        
        /* 成功状态 */
        .success-box {
            background: #f0fdf4;
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } }
        .success-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .success-text { color: #047857; font-size: 16px; font-weight: 500; }
        
        /* 面板选择 */
        .panels { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .panel-card {
            flex: 1; min-width: 220px; padding: 30px;
            border: 3px solid #ddd; border-radius: 15px;
            cursor: pointer; transition: all 0.3s; text-decoration: none; color: #333;
        }
        .panel-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .zashboard { border-color: #10b981; background: #f0fdf4; }
        .zashboard:hover { border-color: #059669; background: #dcfce7; }
        .metacubexd { border-color: #f59e0b; background: #fffbeb; }
        .metacubexd:hover { border-color: #d97706; background: #fef3c7; }
        .panel-card h2 { margin-bottom: 10px; font-size: 20px; }
        .panel-card p { color: #666; font-size: 13px; line-height: 1.5; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 12px; font-weight: 500; }
        .badge-recommend { background: #10b981; color: white; }
        .badge-lightweight { background: #f59e0b; color: white; }
        
        /* 配置表单 */
        .config-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #475569; font-size: 13px; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        .form-group .tips { color: #64748b; font-size: 12px; margin-top: 4px; }
        
        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #0ea5e9;
            color: white;
        }
        .btn-primary:hover { background: #0284c7; transform: translateY(-1px); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
            margin-left: 10px;
        }
        .btn-secondary:hover { background: #cbd5e1; }
        
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #999; font-size: 12px; }
        
        .hidden { display: none !important; }
        
        /* 错误提示 */
        .error-box {
            background: #fef2f2;
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MiProxy</h1>
        <p class="subtitle" id="pageSubtitle">正在检测配置状态...</p>
        
        <!-- 加载中 -->
        <div id="loadingView" class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">正在连接服务器...</p>
        </div>
        
        <!-- 错误 -->
        <div id="errorView" class="error-box hidden">
            <p id="errorText">发生错误</p>
        </div>
        
        <!-- 服务启动中 -->
        <div id="startingView" class="loading-box hidden">
            <div class="spinner"></div>
            <p class="loading-text">正在启动服务，请稍候...</p>
        </div>
        
        <!-- 配置向导 -->
        <div id="configView" class="hidden">
            <div class="config-box">
                <div class="form-group">
                    <label>订阅类型</label>
                    <select id="subType" onchange="toggleSubUrl()">
                        <option value="none">暂不配置</option>
                        <option value="remote">远程订阅 URL</option>
                        <option value="local">本地订阅文件</option>
                    </select>
                    <p class="tips">可跳过，后续在控制面板中配置</p>
                </div>
                <div id="subUrlGroup" class="form-group hidden">
                    <label>订阅 URL</label>
                    <input type="text" id="subUrl" placeholder="https://example.com/api/v1/client/subscribe?token=xxx">
                </div>
                <div id="subPathGroup" class="form-group hidden">
                    <label>本地订阅文件</label>
                    <input type="text" id="subPath" placeholder="/vol1/@appshare/miproxy/sub.yaml">
                </div>
            </div>
            <button class="btn btn-primary" id="configBtn" onclick="saveConfig()">完成配置</button>
        </div>
        
        <!-- 面板选择 -->
        <div id="panelView" class="hidden">
            <p class="subtitle">服务已就绪，请选择控制面板</p>
            <div class="panels">
                <a href="/ui/zashboard/" class="panel-card zashboard">
                    <h2>Zashboard</h2>
                    <p>现代化界面，功能丰富<br>支持节点管理、规则配置</p>
                    <span class="badge badge-recommend">推荐</span>
                </a>
                <a href="/ui/metacubexd/" class="panel-card metacubexd">
                    <h2>MetaCubeXD</h2>
                    <p>经典 Clash 风格，轻量稳定<br>简洁直观，易于操作</p>
                    <span class="badge badge-lightweight">轻量</span>
                </a>
            </div>
        </div>
        
        <!-- 备份恢复提示 -->
        <div id="restoreView" class="hidden">
            <div class="success-box">
                <div class="success-icon">📦</div>
                <p class="success-text">检测到保留数据，配置已自动恢复！</p>
            </div>
            <button class="btn btn-primary" onclick="showPanelView()">打开控制面板</button>
        </div>
        
        <div class="footer">
            <p id="versionText">MiProxy v2.7.1 | mihomo 代理核心</p>
        </div>
    </div>

    <script>
        // 状态检测
        async function checkStatus() {
            try {
                const resp = await fetch('/cgi-bin/status.cgi');
                if (!resp.ok) throw new Error('服务器连接失败');
                const data = await resp.json();
                return data;
            } catch (e) {
                console.error('状态检测失败:', e);
                return null;
            }
        }
        
        // 检测服务状态
        async function checkServiceStatus() {
            try {
                const resp = await fetch('/cgi-bin/status.cgi?check=service');
                if (!resp.ok) return false;
                const data = await resp.json();
                return data.running === true;
            } catch {
                return false;
            }
        }
        
        // 启动服务
        async function startService() {
            try {
                const resp = await fetch('/cgi-bin/config.cgi?action=start', {
                    method: 'POST'
                });
                return resp.ok;
            } catch {
                return false;
            }
        }
        
        // 主流程
        async function init() {
            const loadingView = document.getElementById('loadingView');
            const loadingText = document.getElementById('loadingText');
            const errorView = document.getElementById('errorView');
            const configView = document.getElementById('configView');
            const panelView = document.getElementById('panelView');
            const restoreView = document.getElementById('restoreView');
            const subtitle = document.getElementById('pageSubtitle');
            
            loadingText.textContent = '正在检测配置状态...';
            
            const status = await checkStatus();
            
            if (!status) {
                // 无法连接服务器
                loadingView.classList.add('hidden');
                errorView.classList.remove('hidden');
                document.getElementById('errorText').textContent = '无法连接服务器，请确保应用已正确安装';
                return;
            }
            
            if (status.has_backup && !status.configured) {
                // 有备份但未恢复 - 自动恢复
                loadingText.textContent = '正在恢复配置...';
                const resp = await fetch('/cgi-bin/config.cgi?action=restore', {
                    method: 'POST'
                });
                if (resp.ok) {
                    loadingView.classList.add('hidden');
                    restoreView.classList.remove('hidden');
                    subtitle.textContent = '数据恢复成功';
                    return;
                }
            }
            
            if (!status.configured) {
                // 未配置 - 显示配置向导
                loadingView.classList.add('hidden');
                configView.classList.remove('hidden');
                subtitle.textContent = '首次配置';
                return;
            }
            
            // 已配置 - 检查服务状态
            loadingText.textContent = '正在检查服务状态...';
            const serviceRunning = await checkServiceStatus();
            
            if (!serviceRunning) {
                // 服务未启动 - 启动服务
                loadingView.classList.remove('hidden');
                document.getElementById('startingView').classList.remove('hidden');
                
                const started = await startService();
                if (started) {
                    // 等待服务启动
                    let retries = 10;
                    while (retries > 0) {
                        await new Promise(r => setTimeout(r, 1000));
                        const running = await checkServiceStatus();
                        if (running) break;
                        retries--;
                    }
                }
            }
            
            // 显示面板选择
            loadingView.classList.add('hidden');
            panelView.classList.remove('hidden');
            subtitle.textContent = '服务已就绪';
        }
        
        // 保存配置
        async function saveConfig() {
            const btn = document.getElementById('configBtn');
            const subType = document.getElementById('subType').value;
            const subUrl = document.getElementById('subUrl').value;
            const subPath = document.getElementById('subPath').value;
            
            btn.disabled = true;
            btn.textContent = '保存中...';
            
            try {
                const resp = await fetch('/cgi-bin/config.cgi?action=save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sub_type: subType,
                        sub_url: subUrl,
                        sub_path: subPath
                    })
                });
                
                if (!resp.ok) throw new Error('保存失败');
                
                // 启动服务
                btn.textContent = '正在启动服务...';
                await startService();
                
                // 等待服务启动
                let retries = 15;
                while (retries > 0) {
                    await new Promise(r => setTimeout(r, 1000));
                    const running = await checkServiceStatus();
                    if (running) break;
                    retries--;
                }
                
                // 显示成功
                document.getElementById('configView').classList.add('hidden');
                document.getElementById('panelView').classList.remove('hidden');
                document.getElementById('pageSubtitle').textContent = '配置完成，服务已启动';
                
            } catch (e) {
                alert('配置保存失败: ' + e.message);
                btn.disabled = false;
                btn.textContent = '完成配置';
            }
        }
        
        // 显示面板选择
        function showPanelView() {
            document.getElementById('restoreView').classList.add('hidden');
            document.getElementById('panelView').classList.remove('hidden');
        }
        
        // 切换订阅类型显示
        function toggleSubUrl() {
            const subType = document.getElementById('subType').value;
            document.getElementById('subUrlGroup').classList.toggle('hidden', subType !== 'remote');
            document.getElementById('subPathGroup').classList.toggle('hidden', subType !== 'local');
        }
        
        // 页面加载时自动检测
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
