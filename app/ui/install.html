<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安装 MiProxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .form { padding: 30px; }
    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .form-group .help {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .form-group .error {
      font-size: 12px;
      color: #dc3545;
      margin-top: 4px;
      display: none;
    }
    .form-group.error input { border-color: #dc3545; }
    .form-group.error .error { display: block; }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .message.error {
      background: #fee2e2;
      color: #dc3545;
      display: block;
    }
    .message.success {
      background: #dcfce7;
      color: #16a34a;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>安装 MiProxy</h1>
      <p>mihomo 代理核心</p>
    </div>
    <form class="form" id="installForm">
      <div id="message" class="message"></div>
      
      <div class="form-group" id="groupProxyUser">
        <label>代理用户名</label>
        <input type="text" id="proxyUser" placeholder="留空则不启用认证">
        <p class="help">用于 mihomo 代理连接验证</p>
      </div>
      
      <div class="form-group" id="groupProxyPass">
        <label>代理密码</label>
        <input type="password" id="proxyPass" placeholder="留空则不启用认证">
        <p class="help">代理连接的密码</p>
      </div>
      
      <div class="form-group" id="groupSecret">
        <label>面板密钥</label>
        <input type="password" id="secret" placeholder="留空则不启用面板认证">
        <p class="help">用于访问控制面板 API，建议设置</p>
      </div>
      
      <div class="form-group" id="groupSubType">
        <label>订阅类型</label>
        <select id="subType" style="width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;">
          <option value="none">暂不配置</option>
          <option value="remote">远程订阅 URL</option>
          <option value="local">本地订阅文件</option>
        </select>
      </div>
      
      <div class="form-group" id="groupSubUrl" style="display:none;">
        <label>订阅 URL</label>
        <input type="text" id="subUrl" placeholder="https://example.com/api/v1/client/subscribe?token=xxx">
      </div>
      
      <div class="form-group" id="groupSubPath" style="display:none;">
        <label>本地订阅文件</label>
        <input type="text" id="subPath" placeholder="/vol1/@appshare/miproxy/sub.yaml">
      </div>
      
      <div class="form-group" id="groupRefreshInterval">
        <label>自动刷新间隔</label>
        <select id="refreshInterval" style="width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;">
          <option value="0">关闭</option>
          <option value="1">每小时</option>
          <option value="6">每 6 小时</option>
          <option value="12">每 12 小时</option>
          <option value="24">每 24 小时</option>
        </select>
      </div>
      
      <button type="submit" class="btn" id="submitBtn">开始安装</button>
    </form>
  </div>
  
  <script>
    // 订阅类型切换
    document.getElementById('subType').addEventListener('change', function() {
      const subUrlGroup = document.getElementById('groupSubUrl');
      const subPathGroup = document.getElementById('groupSubPath');
      subUrlGroup.style.display = this.value === 'remote' ? 'block' : 'none';
      subPathGroup.style.display = this.value === 'local' ? 'block' : 'none';
    });
    
    // 表单提交
    document.getElementById('installForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const message = document.getElementById('message');
      
      btn.disabled = true;
      btn.textContent = '安装中...';
      message.className = 'message';
      message.textContent = '';
      
      const data = {
        proxyUser: document.getElementById('proxyUser').value,
        proxyPass: document.getElementById('proxyPass').value,
        secret: document.getElementById('secret').value,
        subType: document.getElementById('subType').value,
        subUrl: document.getElementById('subUrl').value,
        subPath: document.getElementById('subPath').value,
        refreshInterval: document.getElementById('refreshInterval').value
      };
      
      try {
        const resp = await fetch('/config/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if (resp.ok) {
          message.className = 'message success';
          message.textContent = '安装成功！正在跳转到管理面板...';
          setTimeout(() => window.location.href = '/admin.html', 1500);
        } else {
          const err = await resp.text();
          message.className = 'message error';
          message.textContent = '安装失败: ' + err;
          btn.disabled = false;
          btn.textContent = '重新安装';
        }
      } catch (e) {
        message.className = 'message error';
        message.textContent = '安装失败: ' + e.message;
        btn.disabled = false;
        btn.textContent = '重新安装';
      }
    });
  </script>
</body>
</html>
