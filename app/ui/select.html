<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择控制面板 - MiProxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #1a1a2e; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .panels { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .panel-card {
            flex: 1; min-width: 220px; padding: 30px;
            border: 3px solid #ddd; border-radius: 15px;
            cursor: pointer; transition: all 0.3s; text-decoration: none; color: #333;
        }
        .panel-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .zashboard { border-color: #10b981; background: #f0fdf4; }
        .zashboard:hover { border-color: #059669; }
        .metacubexd { border-color: #f59e0b; background: #fffbeb; }
        .metacubexd:hover { border-color: #d97706; }
        .panel-card h2 { margin-bottom: 10px; }
        .panel-card p { color: #666; font-size: 13px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 12px; }
        .badge-recommend { background: #10b981; color: white; }
        .badge-lightweight { background: #f59e0b; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MiProxy</h1>
        <p class="subtitle">请选择要打开的控制面板</p>
        <div class="panels">
            <a href="/ui/zashboard/" class="panel-card zashboard">
                <h2>📊 Zashboard</h2>
                <p>现代化界面，功能丰富</p>
                <span class="badge badge-recommend">推荐</span>
            </a>
            <a href="/ui/metacubexd/" class="panel-card metacubexd">
                <h2>📋 MetaCubeXD</h2>
                <p>经典 Clash 风格，轻量稳定</p>
                <span class="badge badge-lightweight">轻量</span>
            </a>
        </div>
    </div>
</body>
</html>
